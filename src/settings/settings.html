<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ariadne - Configuración</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <style>
      body {
        margin: 0;
        min-width: 360px;
        background: var(--bg);
        color: var(--text-primary);
      }

      main {
        width: min(100%, 720px);
        margin: 0 auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .page-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }

      .back-button {
        display: inline-grid;
        width: 34px;
        height: 34px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 10px;
        background: transparent;
        cursor: pointer;
      }

      .back-button:hover { background: var(--bg-button); }
      .back-button:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }

      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 28px;
      }

      .setting-card {
        position: relative;
        box-sizing: border-box;
        padding: 16px;
        border: 1px solid transparent;
        border-radius: 16px;
        background: transparent;
      }
      .setting-card::before { content: ""; position: absolute; inset: -1px; border: 1px solid var(--border); border-radius: inherit; background: var(--bg-elevated); box-shadow: 0 6px 18px var(--shadow); transform-origin: top left; pointer-events: none; }
      .setting-card > * { position: relative; }
      .setting-card > .setting-status-ghost { position: absolute; right: auto; margin: 0; min-height: 0; pointer-events: none; transition: none; }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
      }

      select,
      #minimum-meeting-duration {
        box-sizing: border-box;
        width: 100%;
        height: 40px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-button);
        color: var(--text-primary);
        font: inherit;
        font-size: 14px;
        line-height: 20px;
      }

      .helper {
        margin: 8px 0 0;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 20px;
      }

      select:focus-visible,
      #minimum-meeting-duration:focus-visible {
        outline: 2px solid var(--accent-blue);
        outline-offset: 2px;
      }

      .toggle-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .toggle-row .helper { flex: 1; min-width: 0; margin: 0; }

      .toggle {
        width: 42px;
        height: 24px;
        border-radius: 12px;
        padding: 3px;
        display: flex;
        align-items: center;
        cursor: pointer;
        border: 0;
        flex-shrink: 0;
      }

      .toggle-knob {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ffffff;
        transition: transform 0.15s;
      }
      .toggle { background: var(--toggle-off); transition: background-color 240ms cubic-bezier(0.23, 1, 0.32, 1); }
      .toggle-knob { transform: translateX(0); transition: transform 240ms cubic-bezier(0.32, 0.72, 0, 1); }
      .toggle[aria-checked="true"] { background: var(--accent-blue); }
      .toggle[aria-checked="true"] .toggle-knob { transform: translateX(18px); }
      .setting-status { min-height: 20px; margin: 8px 0 0; color: var(--text-secondary); font-size: 12px; }
      .setting-status:empty { min-height: 0; margin: 0; }
      .setting-status.is-error { color: var(--accent-red); }
      .setting-card > label { box-sizing: border-box; padding-right: 112px; }
      .setting-status.is-confirmation { position: absolute; top: 18px; right: 16px; min-height: 0; margin: 0; line-height: 20px; }
      .retry-setting { padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-button); color: var(--text-primary); cursor: pointer; }
      .backup-title { margin: 0 0 8px; font-size: 14px; line-height: 20px; text-wrap: balance; }
      .backup-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      #backup-progress { width: 100%; margin-top: 12px; accent-color: var(--accent-blue); }
      button:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }
      button { transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1), background-color 120ms cubic-bezier(0.23, 1, 0.32, 1); }
      button:active:not(:disabled) { transform: scale(0.97); }
      button:disabled, input:disabled, select:disabled { opacity: .65; cursor: wait; }
      @media (hover: hover) and (pointer: fine) { .retry-setting:hover { filter: brightness(1.1); } }
      @media (hover: none), (pointer: coarse) { .back-button:hover { background: transparent; } }
      @media (prefers-reduced-motion: reduce) { .toggle { transition-duration: 120ms; } .toggle-knob { transition: none; } button { transition-property: background-color; } button:active:not(:disabled) { transform: none; } }
    </style>
  </head>
  <body>
    <main>
      <header class="page-header">
        <button id="back-button" class="back-button" type="button" aria-label="Volver"></button>
        <h1 id="page-heading">Configuración</h1>
      </header>
      <section class="setting-card">
        <label id="minimum-meeting-duration-label" for="minimum-meeting-duration">Duración mínima de la reunión (segundos)</label>
        <input id="minimum-meeting-duration" type="number" min="0" max="9007199254740991" step="1" value="0" required aria-describedby="minimum-meeting-duration-helper" />
        <p id="minimum-meeting-duration-helper" class="helper">0 desactiva el mínimo. Las grabaciones que duren menos del tiempo indicado se descartan sin procesar ni guardar en el historial.</p>
      </section>
      <section class="setting-card">
        <label id="video-preset-label" for="video-preset">Velocidad y calidad del video</label>
        <select id="video-preset">
          <option value="ultrafast">Ultrafast</option>
          <option value="superfast">Superfast</option>
          <option value="veryfast">Veryfast</option>
          <option value="faster">Faster</option>
          <option value="fast">Fast</option>
          <option value="medium">Medium</option>
          <option value="slow">Slow</option>
          <option value="slower">Slower</option>
          <option value="veryslow">Veryslow</option>
        </select>
        <p id="video-preset-helper" class="helper">Más rápido = menos calidad/compresión, más lento = mejor compresión.</p>
      </section>
      <section class="setting-card">
        <label id="debug-logging-label" for="debug-logging">Registro de depuración</label>
        <div class="toggle-row">
          <p id="debug-logging-helper" class="helper">
            Imprime logs detallados en la consola del navegador mientras se graba.
          </p>
          <button
            id="debug-logging"
            class="toggle"
            type="button"
            role="switch"
            aria-checked="false"
            aria-labelledby="debug-logging-label"
            aria-describedby="debug-logging-helper"
          >
            <span class="toggle-knob"></span>
          </button>
        </div>
      </section>
      <section class="setting-card" id="meeting-backup" aria-labelledby="backup-title">
        <h2 class="backup-title" id="backup-title"></h2>
        <p class="helper" id="backup-helper"></p>
        <div class="backup-actions">
          <button class="retry-setting" id="backup-export" type="button" aria-describedby="backup-helper backup-availability" disabled></button>
          <button class="retry-setting" id="backup-import" type="button" aria-describedby="backup-helper backup-availability" disabled></button>
          <input id="backup-file" type="file" accept=".zip,application/zip" hidden />
          <button class="retry-setting" id="backup-confirm" type="button" aria-describedby="backup-status backup-availability" hidden></button>
          <button class="retry-setting" id="backup-cancel" type="button" hidden></button>
        </div>
        <progress id="backup-progress" max="100" hidden></progress>
        <p class="setting-status" id="backup-availability" role="status"></p>
        <p class="setting-status" id="backup-status" role="status"></p>
      </section>
    </main>
    <script type="module" src="settings.js"></script>
  </body>
</html>
