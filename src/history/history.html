<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asterion — Historial</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <style>
      :root { --bg: #1A1D24; --bg-elevated: #232734; --bg-button: #2B303C; --text-primary: #F5F7FA; --text-secondary: #8B93A7; --text-muted: #6A7386; --accent-blue: #3B82F6; --accent-green: #22C55E; --accent-red: #EF4444; --toggle-off: #3A4050; --border: #2C313C; --shadow: #00000040; color-scheme: dark; }
      body { margin: 0; min-width: 0; overflow: hidden; background: var(--bg); color: var(--text-primary); }
      button, input, select { font: inherit; } button { color: inherit; } button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }
      .history-app { width: 100%; height: 100vh; margin: 0; display: grid; grid-template-columns: 280px 520px minmax(480px, 1fr); overflow: hidden; background: var(--bg); }
      .sidebar, .meetings-panel, .detail-panel { min-width: 0; min-height: 0; }
      .sidebar { box-sizing: border-box; padding: 24px; overflow-y: auto; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 20px; }
      .brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; } .brand img { width: 20px; height: 20px; }
      .sidebar-heading { margin: 0 0 4px; font-size: 20px; line-height: 1.2; font-weight: 600; } .sidebar-description { margin: 0; color: var(--text-muted); font-size: 12px; line-height: 1.45; }
      .search-field { position: relative; display: flex; align-items: center; } .search-icon { position: absolute; left: 10px; display: inline-flex; pointer-events: none; }
      .search-field input { width: 100%; height: 36px; padding: 0 10px 0 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-elevated); color: var(--text-primary); font-size: 13px; } .search-field input::placeholder { color: var(--text-muted); }
      .section-label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 11px; font-weight: 600; }
      .filter-chips { display: grid; grid-template-columns: max-content max-content; gap: 8px; } .filter-chip { min-height: 30px; padding: 6px 9px; border: 0; border-radius: 999px; background: transparent; cursor: pointer; color: var(--text-secondary); font-size: 12px; white-space: nowrap; } .filter-chip.is-active { background: var(--bg-button); color: var(--text-primary); }
      .calendar { padding-top: 2px; } .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; } .calendar-title { display: flex; align-items: center; gap: 7px; color: var(--text-primary); font-size: 13px; font-weight: 600; text-transform: capitalize; } .calendar-controls { display: flex; gap: 2px; }
      .icon-button { display: inline-grid; width: 28px; height: 28px; padding: 0; place-items: center; border: 0; border-radius: 6px; background: transparent; cursor: pointer; } .icon-button:hover { background: var(--bg-button); }
      .calendar-weekdays, .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); column-gap: 0; row-gap: 10px; } .calendar-weekdays { margin-bottom: 10px; color: var(--text-muted); font-size: 10px; text-align: center; }
      .calendar-day { position: relative; height: 36px; padding: 0; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 11px; box-sizing: border-box; } .calendar-day:hover { background: var(--bg-button); color: var(--text-primary); } .calendar-day.is-outside { color: var(--text-muted); opacity: .45; } .calendar-day.is-today { border-color: var(--accent-blue); color: var(--accent-blue); font-weight: 600; } .calendar-day.is-selected { border-color: transparent; background: var(--accent-blue); color: var(--text-primary); }
      .meeting-dot { position: absolute; bottom: 3px; left: 50%; width: 4px; height: 4px; border-radius: 50%; background: var(--accent-blue); transform: translateX(-50%); } .calendar-day.is-selected .meeting-dot { background: var(--text-primary); }
      .kpis { display: grid; gap: 10px; } .kpi-row { display: flex; align-items: baseline; gap: 8px; } .kpi-value { min-width: 36px; font-size: 16px; font-weight: 600; } .kpi-label { flex: 1; color: var(--text-muted); font-size: 12px; text-align: right; }
      .meetings-panel { box-sizing: border-box; padding: 20px; overflow: hidden; border-right: 1px solid var(--border); display: flex; flex-direction: column; } .meetings-header { flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; } .meetings-title { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 600; } .results-count { margin: 4px 0 0; color: var(--text-secondary); font-size: 13px; }
      .sort-control { position: relative; display: flex; align-items: center; gap: 6px; min-height: 27px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--bg-elevated); color: var(--text-secondary); font-size: 12px; } .sort-control select { appearance: none; max-width: 158px; padding-right: 16px; border: 0; outline: 0; background: transparent; color: inherit; cursor: pointer; } .sort-chevron { position: absolute; right: 9px; display: inline-flex; pointer-events: none; color: var(--text-muted); }
      .meetings-list { flex: 1; min-height: 0; overflow-y: auto; display: grid; align-content: start; gap: 4px; } .meeting-card { position: relative; padding: 14px; border: 0; border-radius: 12px; background: transparent; } .meeting-card.is-selected { background: var(--bg-elevated); } .meeting-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; } .meeting-title { margin: 0; overflow-wrap: anywhere; font-size: 14px; line-height: 1.35; font-weight: 600; }
      .more-wrap { position: relative; flex: none; } .more-button { display: inline-grid; flex: none; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--text-secondary); cursor: pointer; } .more-button:hover, .more-button.is-open { background: var(--bg-button); color: var(--text-primary); }
      .more-menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 5; min-width: 160px; padding: 6px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-elevated); box-shadow: 0 12px 32px var(--shadow); } .more-menu-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: transparent; color: var(--accent-red); cursor: pointer; font-size: 12px; font-weight: 500; text-align: left; } .more-menu-item:hover { background: var(--bg-button); }
      .meeting-card { cursor: pointer; } .file-chip.is-available { cursor: pointer; border-radius: 6px; } .file-chip.is-available:hover { color: var(--text-primary); }
      .meeting-date { margin: 7px 0 0; color: var(--text-muted); font-size: 12px; line-height: 1.4; } .file-chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 11px; } .file-chip { display: flex; align-items: center; gap: 4px; color: var(--text-secondary); font-size: 11px; } .file-chip.is-unavailable { opacity: .35; } .details-row { display: flex; justify-content: flex-end; margin-top: 11px; } .details-button { padding: 0; border: 0; background: transparent; color: var(--accent-blue); cursor: pointer; font-size: 12px; font-weight: 600; } .empty-state { padding: 20px 0; color: var(--text-secondary); font-size: 13px; }
      .detail-panel { box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden; } .detail-placeholder { max-width: 280px; color: var(--text-muted); font-size: 13px; line-height: 1.5; text-align: center; } .detail-content { flex: 1; width: 100%; align-self: stretch; display: flex; flex-direction: column; min-height: 0; } .detail-header { padding-bottom: 18px; } .detail-title { margin: 0; overflow-wrap: anywhere; font-size: 18px; line-height: 1.3; font-weight: 600; } .detail-date { margin: 8px 0 0; color: var(--text-secondary); font-size: 13px; } .detail-metadata { margin: 6px 0 0; color: var(--text-muted); font-size: 12px; } .detail-tabs { flex: none; display: flex; gap: 5px; padding-bottom: 14px; border-bottom: 1px solid var(--border); } .detail-tab { min-height: 30px; padding: 5px 9px; border: 0; border-radius: 7px; background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 12px; } .detail-tab.is-active { background: var(--bg-button); color: var(--text-primary); font-weight: 600; } .detail-tab-content { flex: 1; min-height: 0; overflow: auto; padding: 16px 0; } .detail-loading, .detail-empty, .media-error { margin: 0; color: var(--text-muted); font-size: 13px; line-height: 1.5; } .custom-media-player { display: grid; gap: 16px; } .custom-audio-player { padding-top: 2px; } .audio-player-label { margin: 0; color: var(--text-secondary); font-size: 13px; } .custom-audio-element { display: none; } .audio-transport, .media-volume-control { display: flex; align-items: center; gap: 10px; } .audio-transport { min-height: 52px; } .media-control-button, .media-play, .video-large-play { display: inline-grid; flex: none; place-items: center; padding: 0; border: 0; color: var(--text-secondary); cursor: pointer; } .media-control-button { width: 34px; height: 34px; border-radius: 50%; background: transparent; } .media-control-button:hover { background: var(--bg-button); color: var(--text-primary); } .media-play { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-blue); color: white; } .media-time { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; } .media-seek, .media-volume { --range-progress: 0%; width: 100%; height: 4px; margin: 0; appearance: none; border-radius: 999px; background: linear-gradient(to right, var(--accent-blue) var(--range-progress), var(--bg-button) var(--range-progress)); cursor: pointer; } .media-seek::-webkit-slider-thumb, .media-volume::-webkit-slider-thumb { width: 12px; height: 12px; appearance: none; border-radius: 50%; background: var(--accent-blue); } .media-seek:disabled { cursor: wait; opacity: .55; } .media-volume-control { color: var(--text-secondary); } .media-volume { width: 108px; } .custom-video-player { position: relative; min-height: 280px; overflow: hidden; border-radius: 12px; background: #0E1016; } .custom-video-element { display: block; width: 100%; min-height: 280px; max-height: 460px; background: #0E1016; object-fit: contain; } .video-controls { position: absolute; right: 0; bottom: 0; left: 0; display: flex; align-items: center; gap: 10px; padding: 12px; background: #00000080; color: white; } .video-controls .media-play { width: 32px; height: 32px; background: transparent; } .video-controls .media-seek { background: linear-gradient(to right, var(--accent-blue) var(--range-progress), #FFFFFF66 var(--range-progress)); } .video-controls .media-seek::-webkit-slider-thumb { background: white; } .video-controls .media-time { color: white; } .video-controls .media-volume-control { color: white; } .video-controls .media-volume { width: 74px; background: linear-gradient(to right, white var(--range-progress), #FFFFFF66 var(--range-progress)); } .video-controls .media-volume::-webkit-slider-thumb { background: white; } .video-large-play { position: absolute; top: 50%; left: 50%; width: 64px; height: 64px; border-radius: 50%; background: #FFFFFF22; color: white; transform: translate(-50%, -50%); } .custom-video-player.is-playing .video-large-play { display: none; } .transcript-list { display: grid; gap: 14px; } .transcript-row { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; } .transcript-time { overflow: hidden; color: var(--text-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; line-height: 1.55; white-space: nowrap; text-overflow: ellipsis; } .transcript-spoken { margin: 0; color: var(--text-secondary); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; } .transcript-spoken strong { color: var(--text-primary); } .manifest-code { margin: 0; padding: 14px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; background: #151820; color: var(--text-secondary); font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; } .json-key { color: #93C5FD; } .json-string { color: #86EFAC; } .json-number { color: #FDE68A; } .json-literal { color: #C4B5FD; } .detail-footer { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; border-top: 1px solid var(--border); } .detail-file-meta { color: var(--text-muted); font-size: 11px; overflow-wrap: anywhere; } .detail-file-actions { display: flex; align-items: center; gap: 10px; } .detail-action, .delete-meeting-button { padding: 0; border: 0; background: transparent; cursor: pointer; font-size: 12px; font-weight: 600; } .detail-action { color: var(--accent-blue); } .detail-footer-separator { width: 1px; height: 14px; background: var(--border); } .delete-meeting-button { color: var(--accent-red); } .delete-modal-backdrop { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; padding: 20px; background: #00000080; } .delete-modal { width: min(400px, 100%); padding: 22px; border: 1px solid var(--border); border-radius: 16px; background: var(--bg-elevated); box-shadow: 0 18px 48px var(--shadow); } .delete-modal h2 { margin: 0; font-size: 17px; } .delete-modal p { margin: 10px 0 0; color: var(--text-secondary); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; } .delete-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; } .modal-cancel, .modal-confirm { min-height: 34px; padding: 0 12px; border: 0; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; } .modal-cancel { background: var(--bg-button); color: var(--text-primary); } .modal-confirm { background: var(--accent-red); color: var(--text-primary); } .modal-confirm:disabled { cursor: wait; opacity: .65; }
      @media (max-width: 1100px) { .history-app { grid-template-columns: 280px minmax(0, 1fr); } .detail-panel { display: none; } } @media (max-width: 700px) { body { overflow: auto; } .history-app { display: block; height: auto; min-height: 100vh; overflow: visible; } .sidebar, .meetings-panel { overflow: visible; border-right: 0; } .sidebar { border-bottom: 1px solid var(--border); } .meetings-panel { display: block; padding-top: 20px; } .meetings-list { overflow: visible; } } @media (max-width: 420px) { .sidebar { padding: 20px; } .meetings-panel { padding: 16px; } .meetings-header { flex-direction: column; } }
      .detail-panel { border-left: 1px solid var(--border); background: var(--bg-elevated); }
      .detail-content { gap: 16px; } .detail-header { padding-bottom: 2px; } .detail-tabs { padding-bottom: 0; border-bottom: 0; }
      .detail-tab { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 8px 12px; border-radius: 8px; font-weight: 500; } .detail-tab.is-active { font-weight: 500; }
      .detail-tab-content { padding: 20px; border-radius: 12px; background: var(--bg); }
      .manifest-code { padding: 0; border: 0; border-radius: 0; background: transparent; }
      .detail-footer { display: flex; flex-direction: column; flex-wrap: nowrap; align-items: stretch; justify-content: flex-start; gap: 12px; padding-top: 0; border-top: 0; } .detail-file-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; } .detail-file-meta { display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; } .detail-file-name { color: var(--text-secondary); font-size: 12px; font-weight: 500; } .detail-file-size { color: var(--text-muted); font-size: 11px; } .detail-file-actions { flex: none; display: flex; align-items: center; gap: 8px; } .detail-action, .delete-meeting-button { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; } .detail-action { padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text-secondary); } .detail-action:hover { background: var(--bg-button); color: var(--text-primary); } .detail-footer-separator { width: 100%; height: 1px; } .delete-meeting-button { color: var(--accent-red); }
      .detail-tab-content.is-audio { display: flex; align-items: center; justify-content: center; } .detail-tab-content.is-audio .custom-media-player { width: 100%; }
      .detail-tab-content.is-video { display: flex; align-items: center; justify-content: center; } .custom-video-player { width: 100%; }
      .audio-player-label { font-weight: 500; }
      .media-round-button { display: inline-grid; flex: none; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: var(--bg-elevated); color: var(--text-secondary); cursor: pointer; } .media-round-button:hover { background: var(--bg-button); color: var(--text-primary); }
      .media-seek { height: 6px; } .media-volume { width: 120px; background: linear-gradient(to right, var(--text-secondary) var(--range-progress), var(--bg-button) var(--range-progress)); } .media-volume::-webkit-slider-thumb { background: var(--text-secondary); }
      .detail-file-actions { flex-wrap: wrap; justify-content: flex-end; }
    </style>
  </head>
  <body>
    <main class="history-app">
      <aside class="sidebar" aria-label="Filtros del historial">
        <div class="brand"><img src="../../icons/icon32.png" alt="" /><span>Asterion</span></div>
        <div><h1 id="page-heading" class="sidebar-heading">Historial</h1><p id="page-description" class="sidebar-description">Reuniones guardadas localmente en este dispositivo.</p></div>
        <div class="search-field"><span id="search-icon" class="search-icon" aria-hidden="true"></span><input id="search-input" type="search" placeholder="Buscar por título" aria-label="Buscar por título" /></div>
        <section aria-labelledby="filters-label" hidden><span id="filters-label" class="section-label">Filtros</span><div id="filter-chips" class="filter-chips"></div></section>
        <section class="calendar" aria-label="Calendario"><div id="calendar"></div></section>
        <section aria-labelledby="kpis-label"><span id="kpis-label" class="section-label">Resumen</span><div id="kpis" class="kpis"></div></section>
      </aside>
      <section class="meetings-panel" aria-labelledby="meetings-title">
        <header class="meetings-header"><div><h2 id="meetings-title" class="meetings-title">Reuniones</h2><p id="results-count" class="results-count"></p></div><label class="sort-control"><select id="sort-select" aria-label="Ordenar reuniones"><option value="newest">Más recientes primero</option><option value="oldest">Más antiguas primero</option></select><span id="sort-chevron" class="sort-chevron" aria-hidden="true"></span></label></header>
        <div id="meetings-list" class="meetings-list" aria-live="polite"></div>
      </section>
      <section id="detail-panel" class="detail-panel" aria-label="Detalle de reunión"></section>
    </main>
    <script type="module" src="history.js"></script>
  </body>
</html>
