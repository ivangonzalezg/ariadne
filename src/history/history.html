<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asterion — Historial</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <style>
      :root { --bg: #1A1D24; --bg-elevated: #232734; --bg-button: #2B303C; --text-primary: #F5F7FA; --text-secondary: #8B93A7; --text-muted: #6A7386; --accent-blue: #3B82F6; --accent-green: #22C55E; --accent-red: #EF4444; --toggle-off: #3A4050; --border: #2C313C; --shadow: #00000040; color-scheme: dark; }
      body { margin: 0; min-width: 0; background: var(--bg); color: var(--text-primary); }
      button, input, select { font: inherit; } button { color: inherit; } button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }
      .history-app { width: min(1440px, 100%); min-height: 100vh; margin: 0 auto; display: grid; grid-template-columns: 280px 520px 640px; background: var(--bg); }
      .sidebar, .meetings-panel, .detail-panel { min-width: 0; }
      .sidebar { padding: 24px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 20px; }
      .brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; } .brand img { width: 20px; height: 20px; }
      .sidebar-heading { margin: 0 0 4px; font-size: 20px; line-height: 1.2; font-weight: 600; } .sidebar-description { margin: 0; color: var(--text-muted); font-size: 12px; line-height: 1.45; }
      .search-field { position: relative; display: flex; align-items: center; } .search-icon { position: absolute; left: 10px; display: inline-flex; pointer-events: none; }
      .search-field input { width: 100%; height: 36px; padding: 0 10px 0 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-elevated); color: var(--text-primary); font-size: 13px; } .search-field input::placeholder { color: var(--text-muted); }
      .section-label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 11px; font-weight: 600; }
      .filter-chips { display: grid; grid-template-columns: max-content max-content; gap: 8px; } .filter-chip { min-height: 30px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); cursor: pointer; color: var(--text-secondary); font-size: 12px; white-space: nowrap; } .filter-chip.is-active { background: var(--bg-button); color: var(--text-primary); }
      .calendar { padding-top: 2px; } .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; } .calendar-title { display: flex; align-items: center; gap: 7px; color: var(--text-primary); font-size: 13px; font-weight: 600; text-transform: capitalize; } .calendar-controls { display: flex; gap: 2px; }
      .icon-button { display: inline-grid; width: 28px; height: 28px; padding: 0; place-items: center; border: 0; border-radius: 6px; background: transparent; cursor: pointer; } .icon-button:hover { background: var(--bg-button); }
      .calendar-weekdays, .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; } .calendar-weekdays { margin-bottom: 4px; color: var(--text-muted); font-size: 10px; text-align: center; }
      .calendar-day { position: relative; height: 28px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 11px; } .calendar-day:hover { background: var(--bg-button); color: var(--text-primary); } .calendar-day.is-outside { color: var(--text-muted); opacity: .45; } .calendar-day.is-today { color: var(--text-primary); font-weight: 600; } .calendar-day.is-selected { background: var(--accent-blue); color: var(--text-primary); }
      .meeting-dot { position: absolute; bottom: 3px; left: 50%; width: 4px; height: 4px; border-radius: 50%; background: var(--accent-blue); transform: translateX(-50%); } .calendar-day.is-selected .meeting-dot { background: var(--text-primary); }
      .kpis { display: grid; gap: 10px; } .kpi-row { display: flex; align-items: baseline; gap: 8px; } .kpi-value { min-width: 36px; font-size: 16px; font-weight: 600; } .kpi-label { color: var(--text-muted); font-size: 12px; }
      .meetings-panel { padding: 20px; border-right: 1px solid var(--border); } .meetings-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; } .meetings-title { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 600; } .results-count { margin: 4px 0 0; color: var(--text-secondary); font-size: 13px; }
      .sort-control { display: flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-elevated); color: var(--text-primary); font-size: 12px; } .sort-control select { max-width: 158px; border: 0; outline: 0; background: transparent; color: inherit; cursor: pointer; }
      .meetings-list { display: grid; gap: 8px; } .meeting-card { padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-elevated); } .meeting-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; } .meeting-title { margin: 0; overflow-wrap: anywhere; font-size: 14px; line-height: 1.35; font-weight: 600; } .more-icon { display: inline-flex; flex: none; color: var(--text-secondary); }
      .meeting-date { margin: 7px 0 0; color: var(--text-muted); font-size: 12px; line-height: 1.4; } .file-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; } .file-chip { padding: 3px 7px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-secondary); font-size: 11px; } .details-button { margin-top: 11px; padding: 0; border: 0; background: transparent; color: var(--accent-blue); cursor: pointer; font-size: 12px; font-weight: 600; } .empty-state { padding: 20px 0; color: var(--text-secondary); font-size: 13px; }
      .detail-panel { display: flex; align-items: center; justify-content: center; padding: 24px; } .detail-placeholder { max-width: 280px; color: var(--text-muted); font-size: 13px; line-height: 1.5; text-align: center; }
      @media (max-width: 1439px) { .history-app { grid-template-columns: 280px minmax(0, 1fr) minmax(360px, 640px); } } @media (max-width: 1100px) { .history-app { grid-template-columns: 280px minmax(0, 1fr); } .detail-panel { display: none; } } @media (max-width: 700px) { .history-app { display: block; } .sidebar, .meetings-panel { border-right: 0; } .sidebar { border-bottom: 1px solid var(--border); } .meetings-panel { padding-top: 20px; } } @media (max-width: 420px) { .sidebar { padding: 20px; } .meetings-panel { padding: 16px; } .meetings-header { flex-direction: column; } }
    </style>
  </head>
  <body>
    <main class="history-app">
      <aside class="sidebar" aria-label="Filtros del historial">
        <div class="brand"><img src="../../icons/icon32.png" alt="" /><span>Asterion</span></div>
        <div><h1 class="sidebar-heading">Historial</h1><p class="sidebar-description">Reuniones guardadas localmente en este dispositivo.</p></div>
        <div class="search-field"><span id="search-icon" class="search-icon" aria-hidden="true"></span><input id="search-input" type="search" placeholder="Buscar por título" aria-label="Buscar por título" /></div>
        <section aria-labelledby="filters-label"><span id="filters-label" class="section-label">Filtros</span><div id="filter-chips" class="filter-chips"></div></section>
        <section class="calendar" aria-label="Calendario"><div id="calendar"></div></section>
        <section aria-labelledby="kpis-label"><span id="kpis-label" class="section-label">Resumen</span><div id="kpis" class="kpis"></div></section>
      </aside>
      <section class="meetings-panel" aria-labelledby="meetings-title">
        <header class="meetings-header"><div><h2 id="meetings-title" class="meetings-title">Reuniones</h2><p id="results-count" class="results-count"></p></div><label class="sort-control"><span id="sort-icon" aria-hidden="true"></span><select id="sort-select" aria-label="Ordenar reuniones"><option value="newest">Más recientes primero</option><option value="oldest">Más antiguas primero</option></select></label></header>
        <div id="meetings-list" class="meetings-list" aria-live="polite"></div>
      </section>
      <section id="detail-panel" class="detail-panel" aria-label="Detalle de reunión"></section>
    </main>
    <script type="module" src="history.js"></script>
  </body>
</html>
